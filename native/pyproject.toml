[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "sculpt_kit_remesh"
version = "0.0.3"
description = "Sculpt Kit's quad remesh engine: Instant Meshes in memory, with a hook for our own direction field"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = ["numpy>=1.24"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"          # one stable-ABI wheel per platform covers Blender's Python 3.13 and later
cmake.build-type = "Release"
cmake.args = ["-DCMAKE_POLICY_VERSION_MINIMUM=3.5"]   # the 2017 TBB fork's CMakeLists predates CMake 4's floor

[tool.cibuildwheel]
build = "cp312-*"
skip = ["*-musllinux_*", "*_i686", "*-win32"]
build-verbosity = 1
test-requires = ["numpy"]
test-command = "python {package}/tests/smoke.py"   # {package} is native/; {project} is the repository root

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
