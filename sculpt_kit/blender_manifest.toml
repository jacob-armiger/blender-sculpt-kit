schema_version = "1.0.0"

id = "sculpt_kit"
version = "0.5.5"
name = "Sculpt Kit"
tagline = "ZBrush-style sculpting setup with one switch per feature"
maintainer = "Jacob Armiger"
type = "add-on"

blender_version_min = "5.2.0"

license = ["SPDX:GPL-3.0-or-later"]

# Experiment (Option B of the remesher plan): Instant Meshes as a second quad-remesh engine, from the BSD-3
# pyinstantmeshes wheel. One wheel per platform; `extension build --split-platforms` makes one zip each.
platforms = ["macos-arm64", "windows-x64", "linux-x64"]
wheels = [
    "./wheels/pyinstantmeshes-1.0.0-cp313-cp313-macosx_11_0_arm64.whl",
    "./wheels/pyinstantmeshes-1.0.0-cp313-cp313-win_amd64.whl",
    "./wheels/pyinstantmeshes-1.0.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl",
]

[permissions]
clipboard = "Copy the active brush's settings for tuning"

[build]
paths_exclude_pattern = ["__pycache__/", ".DS_Store", "*.blend1"]
