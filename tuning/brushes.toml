# Brush tuning for Sculpt Kit.
#
# After a pen session:
#   1. In Blender, adjust a brush until it feels right.
#   2. Press "Copy Tuning" in the Sculpt Kit sidebar tab (Sculpt Mode).
#   3. Paste the copied block below, replacing any earlier block for that brush.
#   4. Run tools/build.sh, then tools/install.sh with Blender closed.
#
# Each table is named after the brush. Every key is optional and overrides the
# value the brush was built with. Keys match Blender's brush property names;
# "falloff" is a custom falloff curve as [[distance, strength], ...].
#
# Example:
#
# [brushes."Kingslien_Clay"]
# strength = 0.6
# use_pressure_size = true
